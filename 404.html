    :root{}

    * {
      box-sizing:border-box;
      margin:0;
      padding:0
    }

    body {
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
      background:var(--bg);
      color:var(--text);
      font-family:'Cairo', 'Cairo', sans-serif
    }

    .box {
      width:100%;
      max-width:520px;
      text-align:center;
      background:var(--card);
      border:1px solid rgba(255, 255, 255, .05);
      border-radius:20px;
      box-shadow:0 8px 24px rgba(0, 0, 0, .25);
      padding:40px 28px

    .code {
      font-size:clamp(64px, 18vw, 96px);
      font-weight:800;
      line-height:1;
      color:var(--primary);
      direction:ltr
    }

    h1 {
      font-size:1.6rem;
      font-weight:800;
      margin:14px 0 6px
    }

    .en {
      color:var(--dim);
      font-size:.95rem;
      direction:ltr
    }

    p {
      color:var(--dim);
      line-height:1.8;
      margin-top:14px
    }

    .links {
      display:flex;
      flex-wrap:wrap;
      gap:12px;
      justify-content:center;
      margin-top:28px
    }

    .links a {
      display:inline-flex;
      flex-direction:column;
      align-items:center;
      min-width:150px;
      text-decoration:none;
      color:var(--text);
      font-weight:700;
      border-radius:50px;
      padding:10px 26px;
      transition:.2s
    }

    .links a small {
      font-size:.72rem;
      font-weight:400;
      opacity:.75;
      direction:ltr
    }

    .links .main {
      background:var(--primary)
    }

    .links .main:hover {
      background: #2f4be6
    }

    .links .alt {
      background:rgba(255, 255, 255, .05);
      border:1px solid rgba(255, 255, 255, .1)
    }

    .links .alt:hover {
      background: var(--card-hover)
    }

    .links a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset:3px
    }
  </style>
</head>
